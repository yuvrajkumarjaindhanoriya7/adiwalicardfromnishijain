<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali - From Nishi Jain</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, "Times New Roman", serif;
    background:
        radial-gradient(circle at 50% 40%, #5b1600 0%, #250700 45%, #080000 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* Background glow */
body::before {
    content: "";
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255, 166, 0, .25),
        transparent 65%
    );
    filter: blur(20px);
    animation: glow 3s infinite alternate;
}

@keyframes glow {
    from { transform: scale(.9); opacity: .6; }
    to { transform: scale(1.15); opacity: 1; }
}

/* Card */
.card {
    position: relative;
    width: min(92vw, 650px);
    min-height: 520px;
    padding: 50px 30px;
    text-align: center;
    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(90, 10, 0, .88),
            rgba(25, 2, 0, .94)
        );

    border: 2px solid rgba(255, 190, 60, .7);

    box-shadow:
        0 0 20px rgba(255, 140, 0, .35),
        0 0 70px rgba(255, 80, 0, .25),
        inset 0 0 40px rgba(255, 150, 0, .08);

    z-index: 2;
    animation: cardAppear 1.3s ease;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: scale(.8) translateY(30px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

/* Decorative corners */
.corner {
    position: absolute;
    font-size: 35px;
    color: #ffd45c;
    text-shadow: 0 0 15px orange;
}

.c1 { top: 15px; left: 20px; }
.c2 { top: 15px; right: 20px; }
.c3 { bottom: 15px; left: 20px; }
.c4 { bottom: 15px; right: 20px; }

/* Om */
.om {
    font-size: 48px;
    color: #ffd45c;
    text-shadow:
        0 0 10px #ffb300,
        0 0 30px #ff6f00;
    animation: omGlow 2s infinite alternate;
}

@keyframes omGlow {
    from { text-shadow: 0 0 8px #ffb300; }
    to {
        text-shadow:
            0 0 15px #ffd54f,
            0 0 35px #ff6f00;
    }
}

/* Heading */
h1 {
    margin-top: 10px;
    font-size: clamp(42px, 10vw, 76px);
    color: #ffd54f;

    text-shadow:
        0 0 5px #fff3b0,
        0 0 15px #ffb300,
        0 0 35px #ff6f00;

    animation: titleGlow 2s infinite alternate;
}

@keyframes titleGlow {
    from { transform: scale(1); }
    to { transform: scale(1.03); }
}

.subtitle {
    margin-top: 5px;
    font-size: 20px;
    color: #ffe8a3;
    letter-spacing: 3px;
}

.message {
    margin: 30px auto;
    max-width: 500px;
    font-size: 20px;
    line-height: 1.7;
    color: #fff5d6;
}

/* Diyas */
.diyas {
    display: flex;
    justify-content: center;
    gap: 45px;
    margin-top: 20px;
}

.diya {
    position: relative;
    width: 65px;
    height: 30px;
    background: linear-gradient(#e58b20, #8c3100);
    border-radius: 0 0 50px 50px;
    box-shadow: 0 8px 20px rgba(255, 90, 0, .4);
}

.flame {
    position: absolute;
    left: 50%;
    bottom: 23px;
    width: 22px;
    height: 35px;

    background: radial-gradient(
        ellipse at bottom,
        #fff8b0 5%,
        #ffd000 35%,
        #ff6500 70%,
        transparent 72%
    );

    transform: translateX(-50%);
    border-radius: 50% 50% 50% 50%;
    filter: drop-shadow(0 0 10px #ffb300);
    animation: flame 0.7s infinite alternate ease-in-out;
}

@keyframes flame {
    from {
        transform: translateX(-50%) scale(.9) rotate(-3deg);
    }
    to {
        transform: translateX(-50%) scale(1.1) rotate(3deg);
    }
}

/* From */
.from {
    margin-top: 25px;
    font-size: 19px;
    color: #ffdf75;
}

.name {
    margin-top: 5px;
    font-size: 30px;
    font-weight: bold;
    color: #fff1a8;
    text-shadow: 0 0 15px #ff9800;
}

/* Button */
button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(45deg, #ff8f00, #ffd54f);
    color: #4b1700;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255, 170, 0, .4);
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 30px rgba(255, 190, 0, .8);
}

/* Floating sparks */
.spark {
    position: fixed;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #ffd54f;
    box-shadow: 0 0 10px #ff9800;
    pointer-events: none;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateY(-100vh) scale(.2);
        opacity: 0;
    }
}

/* Fireworks */
.firework {
    position: fixed;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffd54f;
    box-shadow: 0 0 15px #ff9800;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    0% {
        transform: scale(1);
        opacity: 1;
    }

    100% {
        transform: scale(25);
        opacity: 0;
    }
}

/* Mobile */
@media(max-width: 500px) {
    .card {
        min-height: 500px;
        padding: 40px 20px;
    }

    .message {
        font-size: 17px;
    }

    .diyas {
        gap: 25px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="corner c1">✦</div>
    <div class="corner c2">✦</div>
    <div class="corner c3">✦</div>
    <div class="corner c4">✦</div>

    <div class="om">ॐ</div>

    <h1>Happy Diwali</h1>

    <div class="subtitle">
        शुभ दीपावली 🪔
    </div>

    <p class="message">
        May the beautiful festival of lights fill your life
        with happiness, peace, prosperity and countless
        beautiful moments. ✨
        <br><br>
        May every diya brighten your path
        and every new beginning bring joy to your heart.
    </p>

    <div class="diyas">

        <div class="diya">
            <div class="flame"></div>
        </div>

        <div class="diya">
            <div class="flame"></div>
        </div>

        <div class="diya">
            <div class="flame"></div>
        </div>

    </div>

    <div class="from">
        With warm wishes,
    </div>

    <div class="name">
        From Nishi Jain ❤️
    </div>

    <button onclick="celebrate()">
        ✨ Celebrate Diwali
    </button>

</div>

<script>

/* Floating golden particles */
function createSpark() {

    const spark = document.createElement("div");
    spark.className = "spark";

    spark.style.left = Math.random() * 100 + "vw";
    spark.style.top = (70 + Math.random() * 30) + "vh";

    spark.style.animationDuration =
        (3 + Math.random() * 5) + "s";

    document.body.appendChild(spark);

    setTimeout(() => {
        spark.remove();
    }, 8000);
}

setInterval(createSpark, 180);


/* Firework celebration */
function celebrate() {

    for (let i = 0; i < 20; i++) {

        setTimeout(() => {

            const firework = document.createElement("div");
            firework.className = "firework";

            firework.style.left =
                (10 + Math.random() * 80) + "vw";

            firework.style.top =
                (10 + Math.random() * 50) + "vh";

            document.body.appendChild(firework);

            setTimeout(() => {
                firework.remove();
            }, 1000);

        }, i * 100);
    }

    // Small greeting animation
    const title = document.querySelector("h1");

    title.style.transform = "scale(1.15)";

    setTimeout(() => {
        title.style.transform = "scale(1)";
    }, 400);
}

</script>

</body>
</html>
